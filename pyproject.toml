[project]
name = "cdt-engineer-provider"
version = "0.1.0a1"
description = "CDT_Engineer Engineering OS MCP provider for AI agents"
readme = "README.md"
authors = [{ name = "Trương Công Định (SlncTrZ)" }]
keywords = ["engineering", "mcp", "cad", "ai-agents", "qa"]
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.4.5,<4",
  "jsonschema>=4.10,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
cdt-engineer = "cdt_engineer.server:main"

[project.urls]
Repository = "https://github.com/SlncTrZ/CDT_Engineer"
Documentation = "https://github.com/SlncTrZ/CDT_Engineer/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cdt_engineer", "execution", "domains", "professional_practice"]

[tool.hatch.build.targets.wheel.force-include]
"docs/TOOL_GUIDE.md" = "cdt_engineer/docs/TOOL_GUIDE.md"
"software" = "cdt_engineer/data/software"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
