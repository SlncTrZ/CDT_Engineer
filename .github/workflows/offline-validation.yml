name: Offline repository validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -c requirements.constraints.txt hatchling build
      - run: python -m pip check
      - run: python scripts/validate_foundation.py
      - run: python -m build --wheel --no-isolation
